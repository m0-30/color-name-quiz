<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慣用色名クイズ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div id="modeScreen">
            <h1>🎨 慣用色名クイズ</h1>

            <button class="mode-btn" onclick="startGame('normal')">👾 通常モード</button>
            <button class="mode-btn" onclick="startGame('challenge')">🔟 10問チャレンジ</button>
            <button class="mode-btn" onclick="startGame('timer')">⌛ 1分チャレンジ</button>
        </div>

        <div id="quizScreen" style="display:none">
            <p>スコア：<span id="score">0</span></p>
            <p id="timerDisplay" style="display:none">
                残り時間：60秒
            </p>

            <div id="colorBox"></div>
            <div id="choices"></div>

            <button onclick="showHint()">ヒント</button>
            <div id="hint"></div>

            <div id="result"></div>
            <div id="explanation"></div>

            <button onclick="nextQuestion()">次の問題</button>
            <button onclick="showReview()">間違い一覧</button>
            <button onclick="startReview()">復習モード</button>

            <div id="review"></div>
        </div>
        <div id="resultScreen" style="display:none">
            <h2 id="resultTitle">全問終了！</h2>
            <p id="finalScore"></p>
            <p id="finalRate"></p>
            <button onclick="restartGame()">
                🔄️もう一度遊ぶ
            </button>
            <button onclick="backToMenu()">
                🏠モード選択へ戻る
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
